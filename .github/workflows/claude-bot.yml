name: Test Workflow
on:
  issue_comment:
    types: [created]

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Local Action
        uses: ./.github/actions/claude-action
        with:
          plugin_marketplaces: "./plugins-marketplace"
          plugins: "reviewer@local-marketplace"
