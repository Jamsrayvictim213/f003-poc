name: Claude Assistant
on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jamsrayvictim213/repo-action-POC@main
        with:
          plugin_marketplaces: "./plugins-marketplace"
          plugins: "reviewer@local-marketplace"
