name: "Claude Action PoC"
description: "Mock action untuk pengujian local marketplace"
inputs:
  plugin_marketplaces:
    description: "Jalur ke marketplace lokal"
    required: false
  plugins:
    description: "Nama plugin yang akan diinstal"
    required: false

runs:
  using: "composite"
  steps:
    - name: Log Inputs
      shell: bash
      run: |
        echo "Marketplace path: ${{ inputs.plugin_marketplaces }}"
        echo "Plugin name: ${{ inputs.plugins }}"
